# 项目站点：website/ 里的 Blume 文档站，构建后部署到 GitHub Pages。
#
#   https://hungtcs.github.io/JianJin/
#
# 只有 website/ 变动时才跑——改 Dart 代码不该触发一次站点部署。
# 首次使用前需在仓库 Settings → Pages 里把 Source 设为 "GitHub Actions"。
name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      # 首页直接引用仓库根的这张截图（不复制一份），换图也要重新部署。
      - 'docs/images/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只允许一个部署在跑，但不取消进行中的那个——中途取消会让线上停在半成品状态。
concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: website

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # lastModified 若日后开启要读 git 历史，浅克隆会静默丢日期。
          fetch-depth: 0

      # 版本取自 website/package.json 的 packageManager 字段；action 默认
      # 只看仓库根的 package.json，这里必须显式指路。
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: website/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v6

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
