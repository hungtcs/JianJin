name: jianjin
description: 剪金 JianJin —— 快速挑选视频中有用的片段并无损导出
publish_to: 'none'
version: 0.0.1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 播放：libmpv，能播 ffmpeg 能解的一切
  media_kit: ^1.1.10
  # 锁在 1.x：2.x 的 Swift 代码要用 libmpv 的 C 类型（mpv_node_list），
  # 而 media_kit_libs_macos_video 至今最新仍是 1.1.4，其 Mpv.framework
  # 只有二进制、没有 Headers/，因此 2.x 在 macOS 上编不过。
  # 上游补齐 macOS libs 包后可再升。Linux 不受影响（用系统 libmpv 的头文件）。
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.4

  # 原生文件对话框（"原生感"的关键一环）
  file_selector: ^1.0.3

  path: ^1.9.0

  # 运行时读取真实 bundle 版本，避免手工同步的版本常量
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false

  # 只打包 PNG；源 SVG 放在 design/ 下，不进产物
  assets:
    - assets/logo/logo_full.png
    - assets/logo/logo_icon.png
